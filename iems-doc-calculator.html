<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>International Express Mail Services (Documents)</title>
  <style>
    :root {
      --primary: #4a6bff;
      --primary-dark: #3a5bff;
      --dark: #2c3e50;
      --light: #f8f9fa;
      --gray: #6c757d;
      --light-gray: #e9ecef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f7ff;
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px;
      overflow-x: auto; /* Enable horizontal scrolling for entire page */
    }

    .container {
      min-width: 1200px; /* Minimum width to ensure table is fully visible */
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    h1 {
      color: var(--primary);
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .date-time {
      position: absolute;
      top: 25px;
      right: 25px;
      font-size: 14px;
      color: #666;
      background: #f8f9fa;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #e0e3ff;
      white-space: nowrap;
    }

    .search-filter {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 300px;
    }

    .filter-box {
      min-width: 200px;
    }

    .search-box input, .filter-box select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e3ff;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .search-box input:focus, .filter-box select:focus {
      border-color: var(--primary);
      outline: none;
    }

    .table-container {
      overflow-x: visible;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #e0e3ff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #e0e3ff;
      padding: 12px 10px;
      text-align: center;
      word-wrap: break-word;
    }

    th {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      background-color: white;
    }

    tr:nth-child(even) td {
      background-color: #f8f9fa;
    }

    tr:hover td {
      background-color: #f0f4ff;
    }

    .country-col {
      text-align: left;
      font-weight: 500;
      position: sticky;
      left: 0;
      background-color: white;
      border-right: 2px solid #e0e3ff;
      min-width: 250px;
      z-index: 5;
    }

    tr:hover .country-col {
      background-color: #f0f4ff;
    }

    .weight-header {
      background-color: var(--primary-dark);
    }

    /* Column widths */
    th:nth-child(1) { width: 250px; }
    th:nth-child(2) { width: 150px; }
    th:nth-child(3) { width: 180px; }
    th:nth-child(4) { width: 180px; }
    th:nth-child(5) { width: 180px; }
    th:nth-child(6) { width: 180px; }
    th:nth-child(7) { width: 180px; }

    /* Highlight matching search results */
    .highlight {
      background-color: #fff9c4 !important;
      font-weight: bold;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-dark);
    }

    @media (max-width: 1200px) {
      body {
        padding: 10px;
      }
      
      .container {
        min-width: 100%;
        margin: 15px auto;
        padding: 15px;
      }
      
      .table-container {
        overflow-x: auto;
      }
      
      table {
        min-width: 1100px;
      }
    }

    @media (max-width: 768px) {
      .date-time {
        position: static;
        text-align: center;
        margin: 0 auto 15px;
        max-width: 100%;
        white-space: normal;
      }
      
      .search-filter {
        flex-direction: column;
      }
      
      .search-box, .filter-box {
        min-width: 100%;
      }
      
      .table-container {
        font-size: 14px;
      }
      
      th, td {
        padding: 8px 6px;
      }
    }
  </style>
</head>

    // Function to format currency
    function formatCurrency(amount) {
      return "₱" + amount.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Function to render the table
    function renderTable(data) {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      
      data.forEach(item => {
        const row = document.createElement('tr');
        
        // Country cell
        const countryCell = document.createElement('td');
        countryCell.className = 'country-col';
        countryCell.textContent = item.country;
        countryCell.dataset.country = item.country.toLowerCase();
        row.appendChild(countryCell);
        
        // Rate cells
        item.rates.forEach(rate => {
          const rateCell = document.createElement('td');
          rateCell.textContent = formatCurrency(rate);
          row.appendChild(rateCell);
        });
        
        tableBody.appendChild(row);
      });
    }

    // Initial render
    renderTable(ratesData);

    // Search functionality
    const searchInput = document.getElementById('searchInput');
    const regionFilter = document.getElementById('regionFilter');
    
    function filterTable() {
      const searchTerm = searchInput.value.toLowerCase();
      const region = regionFilter.value;
      
      const filteredData = ratesData.filter(item => {
        const matchesSearch = item.country.toLowerCase().includes(searchTerm);
        const matchesRegion = region === 'all' || item.region === region;
        return matchesSearch && matchesRegion;
      });
      
      renderTable(filteredData);
      
      // Highlight search matches
      if (searchTerm) {
        const countryCells = document.querySelectorAll('.country-col');
        countryCells.forEach(cell => {
          const countryName = cell.dataset.country;
          if (countryName.includes(searchTerm)) {
            cell.classList.add('highlight');
          } else {
            cell.classList.remove('highlight');
          }
        });
      }
    }
    
    searchInput.addEventListener('input', filterTable);
    regionFilter.addEventListener('change', filterTable);

</html>
