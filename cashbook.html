<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cash Book</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 40px 0;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      color: white;
      background-color: #2196f3;
      padding: 10px 20px;
      border-radius: 8px;
    }

    .date {
      font-size: 16px;
      color: #666;
    }

    .form-content {
      display: flex;
      justify-content: space-between;
      gap: 40px;
    }

    .form-column {
      width: 48%;
    }

    label {
      display: block;
      margin-bottom: 10px;
    }

    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      width: 48%;
    }

    button:hover {
      background-color: #45a049;
    }

    .button-group {
      display: flex;
      justify-content: space-between;
    }
  </style>
  <script>
    function calculateVAT() {
      const fields = ["registeredMail", "ordinaryMail", "postalID"];
      let gross = {};
      let alreadyConverted = true;

      fields.forEach(id => {
        const input = document.getElementById(id);
        const value = parseFloat(input.value) || 0;

        if (!input.dataset.gross || input.dataset.gross === "") {
          input.dataset.gross = value;
          alreadyConverted = false;
        } else if (value != (input.dataset.gross / 1.12).toFixed(2)) {
          input.dataset.gross = value;
          alreadyConverted = false;
        }

        gross[id] = parseFloat(input.dataset.gross) || 0;
      });

      if (alreadyConverted) return;

      const openingBalance = parseFloat(document.getElementById("openingBalance").value) || 0;

      const netRegistered = gross["registeredMail"] / 1.12;
      const netOrdinary = gross["ordinaryMail"] / 1.12;
      const netPostalID = gross["postalID"] / 1.12;

      const vatRegistered = gross["registeredMail"] - netRegistered;
      const vatOrdinary = gross["ordinaryMail"] - netOrdinary;
      const vatPostalID = gross["postalID"] - netPostalID;

      const totalVAT = Math.round((vatRegistered + vatOrdinary + vatPostalID) * 100) / 100;
      const closingBalance = openingBalance + netRegistered + netOrdinary + netPostalID + totalVAT;

      document.getElementById("registeredMail").value = netRegistered.toFixed(2);
      document.getElementById("ordinaryMail").value = netOrdinary.toFixed(2);
      document.getElementById("postalID").value = netPostalID.toFixed(2);

      document.getElementById("valueAddedTax").value = totalVAT.toFixed(2);
      document.getElementById("closingBalance").value = closingBalance.toFixed(2);
      document.getElementById("totalBalance").value = closingBalance.toFixed(2);
    }

    function resetForm() {
      const fields = [
        "openingBalance", "registeredMail", "ordinaryMail", "postalID",
        "valueAddedTax", "closingBalance", "totalBalance"
      ];
      fields.forEach(id => {
        const input = document.getElementById(id);
        input.value = "";
        input.removeAttribute("data-gross");
      });
    }

    function setDate() {
      const dateElem = document.getElementById("currentDate");
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      const formattedDate = now.toLocaleDateString('en-US', options);
      dateElem.textContent = "Today is: " + formattedDate;
    }

    window.onload = setDate;
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Cash Book</div>
      <div class="date" id="currentDate"></div>
    </div>
    <form onsubmit="event.preventDefault(); calculateVAT();">
      <div class="form-content">
        <div class="form-column">
          <label>Opening Balance:
            <input type="number" id="openingBalance" placeholder="0.00" step="0.01">
          </label>

          <label>Misc Revenue (enter amounts including VAT):</label>
          <label>Registered Mail:
            <input type="number" id="registeredMail" placeholder="0.00" step="0.01">
          </label>
          <label>Ordinary Mail:
            <input type="number" id="ordinaryMail" placeholder="0.00" step="0.01">
          </label>
          <label>Sales Income (enter amounts including VAT):</label>
          <label>Postal ID:
            <input type="number" id="postalID" placeholder="0.00" step="0.01">
          </label>
        </div>

        <div class="form-column">
          <label>Value Added Tax:
            <input type="text" id="valueAddedTax" placeholder="0.00" readonly>
          </label>

          <label>Closing Balance:
            <input type="text" id="closingBalance" placeholder="0.00" readonly>
          </label>

          <label>Total Balance:
            <input type="text" id="totalBalance" placeholder="0.00" readonly>
          </label>

          <div class="button-group">
            <button type="submit">Calculate</button>
            <button type="button" onclick="resetForm()" style="background-color: #f44336;">Reset</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
